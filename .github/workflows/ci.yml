# Install, build, type-check and test on every push and pull request.
#
# A red build blocks a release (publication plan, Phase C). The live lane of the test suite is
# skipped here: it needs the fixture account's credentials, which are not available to a pull
# request from a fork.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The versions `engines` claims support for. Adding one here is what allows lowering it.
        node: ["20.x", "22.x", "24.x"]

    steps:
      - uses: actions/checkout@v4
        with:
          # The API contract is vendored into the build from this submodule, which lives in a
          # private repository. The default GITHUB_TOKEN is scoped to this repository alone and
          # cannot read it, so checkout needs a credential that can. Without it the job fails at
          # clone time with "Repository not found".
          #
          # A pull request from a fork receives no secret, so its run fails here. That is
          # accepted: the submodule stays private and forks cannot build.
          submodules: true
          token: ${{ secrets.SHARED_SUBMODULE_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
